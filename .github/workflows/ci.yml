name: CI Pipeline

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.8'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install dvc[gdrive]

    - name: Install AWS CLI (for remote storage, optional)
      run: |
        curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
        unzip awscliv2.zip
        sudo ./aws/install --update

    - name: Set up DVC remote for Google Drive
      run: |
        dvc remote add -d myremote gdrive://1MeauPbkRaJ7_rIcHld9r0L79FAQPS6r
        dvc remote modify myremote gdrive_use_service_account true

    - name: Authenticate to Google Drive
      run: |
        echo "${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}" > /tmp/gdrive-service-account.json
        dvc remote modify myremote gdrive_service_account_json_file_path /tmp/gdrive-service-account.json
        dvc pull

    - name: Run tests
      run: |
        pytest tests/ --maxfail=1 --disable-warnings -q

    - name: Push data to Google Drive
      run: |
        dvc push
